name: Buildn

on:
  push:
    branches: [ "feat/ci" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build all artifacts & launcher
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.26.1]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ${{ github.workspace }}/go/pkg/mod
          key: go-mod-${{ runner.os }}-$(echo ${{ github.sha }} | cut -c1-7)
          restore-keys: |
            go-mod-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Cache Node modules (pnpm store)
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: node-${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            node-${{ runner.os }}-pnpm-

      - name: Build windows Go targets (build-windows)
        run: make build-windows

      - name: Cache frontend/backend node_modules separately
        uses: actions/cache@v4
        with:
          path: |
            web/frontend/node_modules
            web/backend/node_modules
          key: node-${{ runner.os }}-web-${{ hashFiles('web/frontend/pnpm-lock.yaml') }}-${{ hashFiles('web/backend/pnpm-lock.yaml') }}
          restore-keys: |
            node-${{ runner.os }}-web-

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend (embed into backend)
        working-directory: web/frontend
        run: pnpm build:backend

      - name: Build backend (embed frontend)
        working-directory: web
        env:
          WEB_GO: CGO_ENABLED=1 go
        run: make build

      - name: Build launcher for Windows amd64 (Makefile target)
        run: make build-launcher-windows

      - name: Install p7zip
        run: sudo apt-get update && sudo apt-get install -y  p7zip-full

      - name: Create artifacts directory
        run: |
          mkdir -p artifacts

      - name: Create single 7z archive for build/ (only if exists)
        if: always()
        run: |
          if [ -d "build" ]; then
            7z a -t7z -mx=9 artifacts/picoclaw-build.7z build
          else
            echo "Directory 'build' not found — skipping archive creation."
          fi

      - name: Upload combined artifacts (7z)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picoclaw-build-${{ github.run_number }}-7z
          path: artifacts/picoclaw-build.7z
          retention-days: 7
